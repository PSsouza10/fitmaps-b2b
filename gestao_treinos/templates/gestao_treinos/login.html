<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login do Aluno</title>
</head>
<body>
    <h2>Login do Aluno</h2>
    <form method="post">
        {% csrf_token %}
        <label>Usuário:</label>
        <input type="text" name="username"><br>
        <label>Senha:</label>
        <input type="password" name="password"><br>
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
